<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenfoot setup</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 20px; background: #0b0e16; color: #fff; font: 17px/1.4 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 28px; margin: 0 0 6px; } p { color: #aab2c4; margin: 0 0 20px; }
  button.net { display: flex; justify-content: space-between; width: 100%; padding: 16px; margin-bottom: 8px; border: 0; border-radius: 14px;
               background: #1a2030; color: #fff; font: inherit; text-align: left; overflow-wrap: anywhere; }
  small { color: #8a93a8; flex: none; margin-left: 12px; align-self: center; }
  input { box-sizing: border-box; width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid #33405a; border-radius: 12px; background: #141a28; color: #fff; font: inherit; }
  button.go { width: 100%; padding: 16px; border: 0; border-radius: 14px; background: #fff; color: #0b0e16; font: 600 17px system-ui, sans-serif; }
  #err { color: #ff9f8f; } [hidden] { display: none !important; }
  #other { background: none; border: 0; color: #8fb4ff; font: inherit; padding: 12px 0; }
</style>
<section id="pick"><h1>Pick your Wi-Fi</h1><p>This connects your TV box to your network.</p><div id="list"><p>Looking…</p></div><button id="other">Enter a name instead</button></section>
<form id="form" hidden>
  <h1 id="name"></h1><p id="err" hidden></p>
  <input id="ssid" placeholder="Network name" autocapitalize="off" autocorrect="off" hidden>
  <input id="pw" type="password" placeholder="Password" autocapitalize="off" autocorrect="off">
  <button class="go">Connect</button>
  <button type="button" id="back" style="background:none;border:0;color:#8fb4ff;font:inherit;padding:14px 0">Back</button>
</form>
<section id="done" hidden><h1>Connecting…</h1><p>Watch the TV. When it shows the home screen, reconnect your phone to the same Wi-Fi and scan the code on the TV to get your remote. If the TV shows this setup again, rejoin Tenfoot-Setup and try again.</p></section>
<script>
const $ = (id) => document.getElementById(id);
let chosen = null;
function choose(n) {
  chosen = n;
  $("pick").hidden = true; $("form").hidden = false; $("err").hidden = true;
  $("name").textContent = n ? n.ssid : "Other network";
  $("ssid").hidden = !!n;
  $("pw").hidden = !!(n && n.open);
  $("pw").value = "";
}
fetch("/networks").then((r) => r.json()).then((list) => {
  $("list").replaceChildren(...list.map((n) => {
    const b = Object.assign(document.createElement("button"), { className: "net", type: "button" });
    b.append(Object.assign(document.createElement("span"), { textContent: n.ssid }),
             Object.assign(document.createElement("small"), { textContent: n.open ? "Open" : "Secured" }));
    b.onclick = () => choose(n);
    return b;
  }));
  if (!list.length) $("list").replaceChildren(Object.assign(document.createElement("p"), { textContent: "No networks found. Enter a name instead." }));
}, () => {});
$("other").onclick = () => choose(null);
$("back").onclick = () => { $("form").hidden = true; $("pick").hidden = false; };
$("form").onsubmit = async (e) => {
  e.preventDefault();
  const ssid = chosen ? chosen.ssid : $("ssid").value.trim();
  const r = await fetch("/join", { method: "POST", body: JSON.stringify({ ssid, password: chosen && chosen.open ? "" : $("pw").value, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone }) });
  if (r.ok) { $("form").hidden = true; $("done").hidden = false; }
  else { $("err").textContent = await r.text(); $("err").hidden = false; }
};
</script>
