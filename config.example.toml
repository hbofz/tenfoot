# Lives at /home/tenfoot/.config/tenfoot/config.toml. Every setting is optional.
name = "Tenfoot"                 # what the TV, Spotify and AirPlay call this box (run install.sh again after changing it)

# Weather on the home screen (Open-Meteo, no account). Leave out for no weather.
# latitude = 51.5
# longitude = -0.12
# temperature_unit = "celsius"   # or "fahrenheit"

# How phones reach the remote:
#   "lan"        same network, plain HTTP: anyone on the network could read links and Spotify account keys in transit
#   "tailscale"  localhost only; publish with `sudo tailscale serve --bg 8765`
#   "url"        localhost only, behind your own proxy; set remote_url too
remote_mode = "lan"
# remote_url = "https://tv.example.com"

display_mode = "auto"            # the best the TV lists: 1080p at 60 Hz when it can; or e.g. "1280x720@60"
spotify = true
# jellyfin_url = "http://192.168.1.20:8096"   # adds a Jellyfin tile

# Input devices to use as TV remotes, as full-match patterns on the device's name.
# HDMI-CEC remotes show up as vc4-hdmi-N. Add a Bluetooth or USB remote by name:
# remote_devices = ["vc4-hdmi-\\d+", "My Remote"]

# Nobody at the remote: after this many minutes with nothing playing, the picture dims (over apps; the home screen shows
# its photos); after this many hours, the TV turns off over HDMI-CEC, even mid-show. 0: never.
# screensaver_minutes = 10
# standby_hours = 4

# Updates, signed by Tenfoot's release key, from GitHub:
#   "auto"    installs a new release between 3 and 6 at night, then restarts
#   "notify"  says on the TV that one's ready; install it from Settings on the phone remote
#   "off"     doesn't look (for a box you develop on)
# updates = "auto"
